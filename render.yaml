services:
  # 1. InnoFlow Spring Boot REST API
  - type: web
    name: innoflow-backend
    env: docker
    dockerfilePath: ./BackEnd/Dockerfile
    dockerContext: ./BackEnd
    plan: free
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: innoflow-mysql
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: innoflow-mysql
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: innoflow-mysql
          property: password

  # 2. InnoFlow React Client Frontend
  - type: web
    name: innoflow-frontend
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: FRONTEND_PORT
        value: 80

databases:
  # 3. Managed MySQL Database
  - name: innoflow-mysql
    databaseName: campus_research_db
    user: innoflow_user
    plan: free
